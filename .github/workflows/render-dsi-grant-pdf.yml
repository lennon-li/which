name: Render DSI grant proposal PDF

on:
  push:
    branches:
      - bootstrap-framework
    paths:
      - "docs/grants/2026-09-dsi-anthropic-ai-privacy-firewall-proposal.md"
      - ".github/workflows/render-dsi-grant-pdf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: bootstrap-framework
          fetch-depth: 0

      - name: Install PDF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-latex-extra texlive-fonts-recommended lmodern

      - name: Render PDF
        run: |
          INPUT="docs/grants/2026-09-dsi-anthropic-ai-privacy-firewall-proposal.md"
          OUTPUT="docs/grants/2026-09-dsi-anthropic-ai-privacy-firewall-proposal.pdf"
          pandoc "$INPUT" \
            --from=markdown \
            --pdf-engine=xelatex \
            --toc \
            --number-sections \
            -V geometry:margin=0.72in \
            -V fontsize=10pt \
            -V colorlinks=true \
            -V linkcolor=blue \
            -V urlcolor=blue \
            -V toc-title="Contents" \
            -o "$OUTPUT"
          test -s "$OUTPUT"

      - name: Upload rendered PDF
        uses: actions/upload-artifact@v4
        with:
          name: dsi-grant-proposal-pdf
          path: docs/grants/2026-09-dsi-anthropic-ai-privacy-firewall-proposal.pdf
          if-no-files-found: error

      - name: Commit rendered PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/grants/2026-09-dsi-anthropic-ai-privacy-firewall-proposal.pdf
          if git diff --cached --quiet; then
            echo "PDF unchanged"
            exit 0
          fi
          git commit -m "docs: render DSI grant proposal PDF"
          git push origin HEAD:bootstrap-framework
